name: Container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Check startup script and devcontainer configuration
        run: |
          python3 -c "import ast; ast.parse(open('container-image/start-gateway').read())"
          python3 -m json.tool .devcontainer/devcontainer.json > /dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build smoke-test image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: container-image/Dockerfile
          load: true
          push: false
          tags: wanderlog-mcp:test
      - name: Run gateway unit tests from read-only repository mount
        run: |
          docker run --rm \
            --mount type=bind,src="$PWD/mcp",dst=/tests,readonly \
            --workdir /tests \
            --env PYTHONPATH=/tests \
            wanderlog-mcp:test python -m unittest discover -s /tests -v
      - name: Test image user, CLI, startup, duplicate calls and crash recovery
        run: |
          docker run --rm \
            --mount type=bind,src="$PWD/container-image/smoke-test.py",dst=/tmp/smoke-test.py,readonly \
            wanderlog-mcp:test python /tmp/smoke-test.py

  publish:
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          persist-credentials: false
      - name: Normalize GHCR image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@783ae9cac559640a24c9212dfa6cd9e998252f9a
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested revision
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: container-image/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
